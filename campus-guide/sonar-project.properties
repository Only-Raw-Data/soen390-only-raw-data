sonar.projectKey=Only-Raw-Data_soen390-only-raw-data
sonar.organization=only-raw-data
sonar.host.url=https://sonarcloud.io

sonar.sources=app,components,constants
sonar.tests=app,components,constants
sonar.test.inclusions=**/__tests__/**/*.{ts,tsx},**/*.test.{ts,tsx},**/*.spec.{ts,tsx}

sonar.exclusions=**/node_modules/**,**/coverage/**,**/*.config.js,**/*.config.ts,assets/**

# --- Coverage report (lcov.info generated by Jest --coverage) ---
# Mirrors the 80% coverage targets defined in codecov.yml.
# Both Codecov and SonarCloud consume this same file.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# --- Test execution report (junit.xml generated by jest-junit) ---
# Gives SonarCloud test-count, pass/fail, and duration data.
sonar.testExecutionReportPaths=coverage/junit.xml

# Coverage exclusions ? kept in sync with Jest collectCoverageFrom
sonar.coverage.exclusions=**/node_modules/**,**/coverage/**,**/__tests__/**,**/*.test.{ts,tsx},**/*.spec.{ts,tsx},assets/**

sonar.sourceEncoding=UTF-8
