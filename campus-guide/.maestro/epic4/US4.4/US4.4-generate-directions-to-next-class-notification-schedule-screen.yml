appId: com.soen390.campusguide
---
- launchApp
- extendedWaitUntil:
    visible: "SGW Campus"
    timeout: 1800000

- assertVisible: "SGW Campus"

- tapOn:
    point: "90%,93%"
- waitForAnimationToEnd

- tapOn: "Schedule"
- waitForAnimationToEnd

- tapOn: ".*Get Directions.*"
- waitForAnimationToEnd

- assertVisible:
    text: ".*mins.*km.*" 

- stopApp