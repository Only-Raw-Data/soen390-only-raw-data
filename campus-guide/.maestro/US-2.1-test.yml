# .maestro/US-2.1-test.yml
appId: com.anonymous.campusguide
---
- launchApp

# Wait for app to load
- extendedWaitUntil:
    visible: "Concordia Campus Guide"
    timeout: 60000

# Navigate to Directions page
- extendedWaitUntil:
    visible: "Concordia Campus Guide"
    timeout: 60000

- tapOn: "Directions"
- waitForAnimationToEnd

# Assert Directions page elements
- assertVisible: "Get Directions"
# - assertVisible: "Start location"
# - assertVisible: "Destination"

# Tap on Start location field
- tapOn:
    id: "start-input"

- assertVisible:
    id: "start-input"
    focused: true

# Enter start location (you may need to adjust based on your input method)
- inputText: "HE"
- tapOn:
    point: "50%, 40%" 

# Confirm/close keyboard or selection (if needed)
# - hideKeyboard

# Tap on Destination field
- tapOn:
    id: "dest-input"

- assertVisible:
    id: "dest-input"
    focused: true

# Enter destination
- inputText: "BH"
- tapOn:
    point: "50%, 30%" 


# Confirm/close keyboard
# - hideKeyboard

# Assert both fields are filled
- assertVisible: "BB-BH Annex"
- assertVisible: "Henry F. Hall Building"

# Select transport mode test
- tapOn: "Car"
- tapOn: "Transit"
- tapOn: "Walk"