appId: com.soen390.campusguide
---
- launchApp
- extendedWaitUntil:
    visible: "SGW Campus"
    timeout: 1800000

- assertVisible: "SGW Campus"

- tapOn:
    point: "90%,93%"
- waitForAnimationToEnd

- setLocation:
    latitude: 45.4972
    longitude: -73.5789

- tapOn:
    id: "poi-toggle-button"
- waitForAnimationToEnd

- stopApp