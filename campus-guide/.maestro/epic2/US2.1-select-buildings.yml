appId: com.soen390.campusguide
---
- launchApp
- extendedWaitUntil:
    visible: "SGW Campus"
    timeout: 1800000

- assertVisible: "SGW Campus"

- tapOn:
    point: "90%,93%"
- waitForAnimationToEnd

- tapOn: "Directions"
- waitForAnimationToEnd

- assertVisible: "Start location"
- tapOn: "Start location"
- inputText: "Henry"
- hideKeyboard
- waitForAnimationToEnd

- tapOn: "Henry F. Hall Building"
- waitForAnimationToEnd

- assertVisible: "Destination"
- tapOn: "Destination"
- inputText: "John"
- hideKeyboard
- waitForAnimationToEnd

- tapOn: "John Molson Building"
- waitForAnimationToEnd

- assertVisible: "Henry F. Hall Building"
- assertVisible: "John Molson Building"

- tapOn:
    point: "50%,45%"
- waitForAnimationToEnd

- stopApp