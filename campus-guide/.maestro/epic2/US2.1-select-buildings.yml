appId: com.campus.campusguide
---
- launchApp
- waitForAnimationToEnd

- assertVisible: "SGW Campus"

- tapOn: "Directions"
- waitForAnimationToEnd

- assertVisible: "Start location"
- tapOn: "Start location"
- inputText: "Henry"
- hideKeyboard
- waitForAnimationToEnd

- tapOn: "Henry F. Hall Building"
- waitForAnimationToEnd


- assertVisible: "Destination"
- tapOn: "Destination"
- inputText: "John"
- hideKeyboard
- waitForAnimationToEnd

- tapOn: "John Molson Building"
- waitForAnimationToEnd

# Verify both buildings are selected
- assertVisible: "Henry F. Hall Building"
- assertVisible: "John Molson Building"

# Tap the Get Directions button (using coordinates to ensure we hit the button, not the heading)
- tapOn:
    point: "50%,45%"
- waitForAnimationToEnd

