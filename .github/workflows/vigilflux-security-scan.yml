name: VigilFlux Security Scan

on:
  workflow_call:
    secrets:
      VIGILFLUX_API_KEY:
        required: true

jobs:
  vigilflux-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Start Scan
        id: start
        run: |
          response=$(curl -sL -w "\nHTTP_STATUS:%{http_code}" -X POST https://api.vigilflux.com/api/scans \
            -H "Authorization: Bearer ${{ secrets.VIGILFLUX_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "repo_url": "${{ github.server_url }}/${{ github.repository }}",
              "branch": "${{ github.ref_name }}",
              "commit_sha": "${{ github.sha }}"
            }')
          body=$(echo "$response" | sed '$d')
          http_status=$(echo "$response" | tail -1 | cut -d: -f2)
          echo "HTTP $http_status: $body"
          if [ "$http_status" -ne 201 ]; then
            echo "Failed to start scan (HTTP $http_status)"
            exit 1
          fi
          scan_id=$(echo "$body" | jq -r '.id')
          echo "scan_id=$scan_id" >> "$GITHUB_OUTPUT"
          echo "Scan queued: $scan_id"

      - name: Wait for Scan to Complete
        id: poll
        run: |
          scan_id="${{ steps.start.outputs.scan_id }}"
          for i in $(seq 1 30); do
            result=$(curl -sL "https://api.vigilflux.com/api/scans/$scan_id" \
              -H "Authorization: Bearer ${{ secrets.VIGILFLUX_API_KEY }}")
            scan_status=$(echo "$result" | jq -r '.scan.status')
            echo "[$i/30] status: $scan_status"
            if [ "$scan_status" = "completed" ]; then
              echo "Scan completed."
              break
            elif [ "$scan_status" = "failed" ] || [ "$scan_status" = "cancelled" ]; then
              echo "Scan ended with status: $scan_status"
              exit 1
            fi
            if [ "$i" -eq 30 ]; then
              echo "Timed out waiting for scan to complete."
              exit 1
            fi
            sleep 10
          done

      - name: Check Results
        run: |
          scan_id="${{ steps.start.outputs.scan_id }}"
          result=$(curl -sL "https://api.vigilflux.com/api/scans/$scan_id" \
            -H "Authorization: Bearer ${{ secrets.VIGILFLUX_API_KEY }}")

          critical=$(echo "$result" | jq -r '.report.critical_count // 0')
          high=$(echo "$result"     | jq -r '.report.high_count     // 0')
          medium=$(echo "$result"   | jq -r '.report.medium_count   // 0')
          low=$(echo "$result"      | jq -r '.report.low_count      // 0')
          score=$(echo "$result"    | jq -r '.report.risk_score     // "N/A"')

          echo "================================"
          echo " VigilFlux Security Scan Report"
          echo "================================"
          echo " Risk Score : $score"
          echo " Critical   : $critical"
          echo " High       : $high"
          echo " Medium     : $medium"
          echo " Low        : $low"
          echo "================================"

          if [ "$critical" -gt 0 ] || [ "$high" -gt 0 ] || [ "$medium" -gt 0 ]; then
            echo "BLOCKED: $critical critical, $high high, $medium medium vulnerabilities found."
            echo "Fix all medium or higher severity issues before merging."
            exit 1
          fi

          echo "PASSED: No medium or higher vulnerabilities found."
