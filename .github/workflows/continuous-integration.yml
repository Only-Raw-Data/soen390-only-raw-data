name: React Native CI

on:
  workflow_dispatch:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: campus-guide/package-lock.json

      - name: Install Dependencies
        working-directory: campus-guide
        run: npm ci

      - name: Run Tests with Coverage
        working-directory: campus-guide
        run: npm test -- --coverage --coverageReporters=lcov --coverageReporters=text --watchAll=false

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: campus-guide/coverage/lcov.info
          retention-days: 1

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: campus-guide/coverage/lcov.info
