name: React Native CI

on:
  workflow_dispatch:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']

jobs:
  mobile-test:
    name: Mobile Test & Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: campus-guide/package-lock.json

      - name: Install Dependencies
        working-directory: campus-guide
        run: npm ci

      # Produces:
      #   campus-guide/coverage/lcov.info             - coverage (Codecov + Sonar)
      #   campus-guide/coverage/coverage-summary.json - coverage summary (PR comment)
      #   campus-guide/coverage/coverage-final.json   - coverage final (PR comment)
      - name: Run Tests with Coverage
        working-directory: campus-guide
        run: npm test -- --coverage --watchAll=false

      - name: Verify coverage reports exist
        run: |
          ls -lh campus-guide/coverage/lcov.info
          ls -lh campus-guide/coverage/coverage-summary.json
          ls -lh campus-guide/coverage/coverage-final.json

      - name: Jest Coverage Report
        if: github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: Mobile
          json-summary-path: campus-guide/coverage/coverage-summary.json
          json-final-path: campus-guide/coverage/coverage-final.json
          file-coverage-mode: changes
          threshold-icons: '{"0": "🔴", "75": "🟠", "80": "🟢"}'

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            campus-guide/coverage/lcov.info
            campus-guide/coverage/coverage-summary.json
            campus-guide/coverage/coverage-final.json
          retention-days: 1

  sonarqube:
    name: SonarQube Analysis
    needs: mobile-test
    uses: ./.github/workflows/sonarqube.yml
    secrets:
      SONARCLOUD_TOKEN: ${{ secrets.SONARCLOUD_TOKEN }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
