name: React Native CI

on:
  workflow_dispatch:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']

jobs:
  mobile-test:
    name: Mobile Test & Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: campus-guide/package-lock.json

      - name: Install Dependencies
        working-directory: campus-guide
        run: npm ci

      # Produces:
      #   campus-guide/coverage/lcov.info             - coverage (Codecov + Sonar)
      #   campus-guide/coverage/coverage-summary.json - coverage summary (PR comment)
      #   campus-guide/coverage/coverage-final.json   - coverage final (PR comment)
      - name: Run Tests with Coverage
        working-directory: campus-guide
        run: npm test -- --coverage --watchAll=false

      - name: Verify coverage reports exist
        run: |
          ls -lh campus-guide/coverage/lcov.info
          ls -lh campus-guide/coverage/coverage-summary.json
          ls -lh campus-guide/coverage/coverage-final.json

      - name: Jest Coverage Report
        if: github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: Mobile
          json-summary-path: campus-guide/coverage/coverage-summary.json
          json-final-path: campus-guide/coverage/coverage-final.json
          file-coverage-mode: changes
          threshold-icons: '{"0": "🔴", "75": "🟠", "80": "🟢"}'

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: campus-guide/coverage/lcov.info
          retention-days: 1

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: campus-guide/coverage/lcov.info

  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: mobile-test

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Download Coverage Artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: campus-guide/coverage

      # The scanner reads campus-guide/sonar-project.properties because projectBaseDir
      # points at campus-guide. That file is the single source of truth for sonar.projectKey,
      # sonar.organization, and the coverage/test report paths.
      - name: SonarQube Scan (default branch bootstrap)
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        uses: SonarSource/sonarqube-scan-action@a31c9398be7ace6bbfaf30c0bd5d415f843d45e9
        env:
          SONAR_TOKEN: ${{ secrets.SONARCLOUD_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          projectBaseDir: campus-guide

      - name: SonarQube Scan (feature branch)
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_name != github.event.repository.default_branch
        uses: SonarSource/sonarqube-scan-action@a31c9398be7ace6bbfaf30c0bd5d415f843d45e9
        env:
          SONAR_TOKEN: ${{ secrets.SONARCLOUD_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          projectBaseDir: campus-guide
          args: >
            -Dsonar.branch.name=${{ github.ref_name }}

      - name: SonarQube Scan (pull request)
        if: github.event_name == 'pull_request' && vars.SONARCLOUD_READY == 'true'
        uses: SonarSource/sonarqube-scan-action@a31c9398be7ace6bbfaf30c0bd5d415f843d45e9
        env:
          SONAR_TOKEN: ${{ secrets.SONARCLOUD_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          projectBaseDir: campus-guide
          args: >
            -Dsonar.pullrequest.key=${{ github.event.pull_request.number }}
            -Dsonar.pullrequest.branch=${{ github.head_ref }}
            -Dsonar.pullrequest.base=${{ github.base_ref }}

      - name: SonarQube PR scan skipped until bootstrap
        if: github.event_name == 'pull_request' && vars.SONARCLOUD_READY != 'true'
        run: |
          echo 'Skipping SonarCloud PR analysis because SONARCLOUD_READY is not true.'
          echo '1) Make sure the SonarCloud project exists and is bound to this repository.'
          echo '2) Push the repository default branch (${{ github.event.repository.default_branch }}) and let the default-branch scan succeed once.'
          echo '3) Set repository variable SONARCLOUD_READY=true to enable PR analysis.'
